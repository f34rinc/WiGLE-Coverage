<svg xmlns="http://www.w3.org/2000/svg" width="876" height="506" viewBox="0 0 876 506" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<rect x="0" y="0" width="876" height="506" rx="10" fill="#1c2128" stroke="#30363d"/>
<rect x="1" y="1" width="874" height="34" rx="9" fill="#161b22"/>
<rect x="1" y="25" width="874" height="10" fill="#161b22"/>
<line x1="0" y1="34" x2="876" y2="34" stroke="#30363d"/>
<circle cx="18" cy="17" r="6" fill="#ff5f56"/>
<circle cx="38" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="58" cy="17" r="6" fill="#27c93f"/>
<text x="438" y="21" text-anchor="middle" fill="#768390" font-size="12">python wigle_coverage.py</text>
<text x="20" y="63" xml:space="preserve"></text>
<text x="20" y="83" xml:space="preserve"><tspan fill="#c9d1d9"> </tspan><tspan fill="#39c5cf" font-weight="700">wigle-coverage</tspan></text>
<text x="20" y="103" xml:space="preserve"><tspan fill="#768390">========================================================</tspan></text>
<text x="20" y="123" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e6edf3" font-weight="700">data </tspan><tspan fill="#c9d1d9"> | ./data</tspan></text>
<text x="20" y="143" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e6edf3" font-weight="700">found</tspan><tspan fill="#c9d1d9"> | 3 KML/CSV | backup: WiGLE Database Backup.sqlite</tspan></text>
<text x="20" y="163" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e6edf3" font-weight="700">grid </tspan><tspan fill="#c9d1d9"> | cell </tspan><tspan fill="#57ab5a">50 m</tspan><tspan fill="#c9d1d9"> | min-obs 2 | hole 5</tspan></text>
<text x="20" y="183" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e6edf3" font-weight="700">mode </tspan><tspan fill="#c9d1d9"> | </tspan><tspan fill="#57ab5a">entire-DB / union</tspan><tspan fill="#c9d1d9">  |  pois on</tspan></text>
<text x="20" y="203" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#bc8cff" font-weight="700">source</tspan><tspan fill="#c9d1d9"> | </tspan><tspan fill="#bc8cff" font-weight="700">OVERTURE</tspan><tspan fill="#c9d1d9"> | where business names come from (needs duckdb)</tspan></text>
<text x="20" y="223" xml:space="preserve"><tspan fill="#768390">-- view - which slice to map ---------------------------</tspan></text>
<text x="20" y="243" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">all</tspan><tspan fill="#c9d1d9">            whole history / union   </tspan><tspan fill="#768390">(default)</tspan></text>
<text x="20" y="263" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">runs</tspan><tspan fill="#c9d1d9">           list the sessions in the backup</tspan></text>
<text x="20" y="283" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">run</tspan><tspan fill="#c9d1d9"> N          just run N              </tspan><tspan fill="#e3b341">date</tspan><tspan fill="#c9d1d9"> YYYY-MM-DD   just that date</tspan></text>
<text x="20" y="303" xml:space="preserve"><tspan fill="#768390">-- tune ------------------------------------------------</tspan></text>
<text x="20" y="323" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">cell</tspan><tspan fill="#c9d1d9"> N         grid size (m)   </tspan><tspan fill="#e3b341">min</tspan><tspan fill="#c9d1d9"> N   min obs   </tspan><tspan fill="#e3b341">hole</tspan><tspan fill="#c9d1d9"> N   hole threshold</tspan></text>
<text x="20" y="343" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">data</tspan><tspan fill="#c9d1d9"> &lt;path&gt;    read a different folder</tspan></text>
<text x="20" y="363" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">pois</tspan><tspan fill="#c9d1d9">           toggle naming businesses in holes</tspan></text>
<text x="20" y="383" xml:space="preserve"><tspan fill="#768390">-- POI source - where the business names come from -----</tspan></text>
<text x="20" y="403" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#bc8cff" font-weight="700">source</tspan><tspan fill="#c9d1d9">         switch  </tspan><tspan fill="#bc8cff" font-weight="700">overture</tspan><tspan fill="#c9d1d9"> (default; far more businesses; pip install duckdb)  &lt;-&gt;  </tspan><tspan fill="#bc8cff" font-weight="700">osm</tspan><tspan fill="#c9d1d9"> (zero-setup)</tspan></text>
<text x="20" y="423" xml:space="preserve"><tspan fill="#768390">-- go --------------------------------------------------</tspan></text>
<text x="20" y="443" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">go</tspan><tspan fill="#c9d1d9"> (or Enter)  build + open the map    </tspan><tspan fill="#e3b341">help</tspan><tspan fill="#c9d1d9">   commands    </tspan><tspan fill="#e3b341">q</tspan><tspan fill="#c9d1d9">   quit</tspan></text>
<text x="20" y="463" xml:space="preserve"><tspan fill="#768390">========================================================</tspan></text>
<text x="20" y="483" xml:space="preserve"><tspan fill="#c9d1d9">&gt; █</tspan></text>
</svg>
